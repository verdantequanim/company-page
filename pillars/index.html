sleep:{n:'Sleep',step:'Put the phone down 30 minutes before bed.',ev:'In a four week trial, people who did this fell asleep faster, slept longer and slept better.',evs:'Second Military Medical University, Shanghai, 2020. 38 people. Evidence developing.',

c2:[['s',1,'Start with what is yours to change.','Steady bed and wake times. Move during the day. Less caffeine late, and go easy on alcohol and nicotine. A quiet room and a way to wind down. Each habit has research behind it.','North Dakota State University, 2015. Nobody has tested the whole list on the general public.'],
['how','A simple wind-down for tonight','',['Pick the time you need to wake up. Keep it every day, weekends too.','Have your last coffee, pop or energy drink at least six hours before bed.','Thirty minutes before bed, put your phone on the charger outside the bedroom.','Turn the lights down. Read something on paper, or do five minutes of slow breathing.','Lights off. Make the room as dark as you can.'],'Try it for two weeks and watch what your own sleep does.','Caffeine six hours before bed still cut into sleep: Henry Ford Hospital, 2013.',1],
['how','A dark room and no phone: the evidence','',[],'<b>Put the phone down 30 minutes before bed.</b> In a four week trial, people who did this fell asleep faster, slept longer and slept better.<br><br><b>Read paper, not a lit screen.</b> People reading on a lit screen before bed took longer to fall asleep, made less melatonin and were less alert the next morning than when they read a printed book.<br><br><b>Sleep in the dark.</b> Sleeping with a light or television on went with more obesity in a study of 43,722 women.',"Second Military Medical University, Shanghai, 2020: 38 people. Brigham and Women's Hospital and Harvard, 2015. National Institutes of Health, 2019. Evidence developing.",0],
['h','When I brush my teeth at night, I put my phone on the charger outside the bedroom.'],
['s',2,'A stronger method you can still do yourself.','A self-guided sleep skills program, from a book or online, teaches you to retrain your sleep. In trials of people with insomnia the gains lasted, and in-person treatment was not shown to work better.','Vrije Universiteit Amsterdam, 2009: 10 trials, 1,000 people. Aarhus University, 2016: 11 trials, 1,460 people.'],
['s',3,'A sleep assessment is a tool you can choose.','If it has gone on for months, or you snore loudly, gasp in your sleep, or doze off when you do not mean to, an assessment can find causes habits cannot fix. You decide. You can ask for the skills program before sleeping pills.','American College of Physicians, 2016, puts the skills program first. Wording under clinical review.']],

c1s:'What we eat is an upstream cause. These are the health effects found downstream.',

['Food moves blood pressure in weeks.',' Eight weeks of more fruits, vegetables and low fat dairy lowered it 5.5 over 3.0 points.','Johns Hopkins University, 1997. 459 adults. All meals were provided.'],
['About 30 percent fewer heart attacks and strokes',' on a diet built around vegetables, beans, fish and olive oil.','PREDIMED trial, Spain, 2018. 7,447 older adults at high heart risk.']],
c2:[['s',1,'Start with one change.','Trade one pop a day for water. Or add a fruit or a vegetable to one meal. Water from the tap is free, so the first step can save you money.','Harvard, 2010. Norwegian University of Science and Technology, 2017: 95 studies.'],
['how','Five simple rules','',['Shop the outside aisles of the store.','If it has more than five ingredients, leave it on the shelf.','Skip anything your great-grandmother would not recognize as food.','Do not eat anything that will not eventually rot.','Eat at a table with family or friends as often as you can.'],'Beans, oats, rice and frozen vegetables pass every one of these rules, wherever the store keeps them.',"These rules come from Michael Pollan's book Food Rules. They are a simple way to remember what the research points to.",1],
['h','When I sit down to supper, I pour a glass of water first.'],
['s',2,'A stronger step you can still do yourself.','Cook more from basic ingredients and buy fewer ready made packaged foods. In a controlled study, people ate about 500 more calories a day on packaged, ultra-processed food, with the meals matched for sugar, fat and fiber.','National Institutes of Health, 2019. 20 adults. Evidence developing.'],
['b','What it costs','Eating well costs about $1.50 more per person per day. The gap is biggest for meat and close to zero for grains.','Review of 27 studies in 10 countries, 2013.'],
['s',3,'A dietitian is a tool you can choose.','If a doctor or dietitian has given you an eating plan for a condition such as kidney disease or diabetes, that plan comes first. A dietitian can also help you build a plan around a budget or a family.','Wording under clinical review.']],

['More helps, up to a point.',' Meeting the recommended amount went with a 31 percent lower risk. No harm was seen at ten times that amount.','National Cancer Institute, 2015.'],
['Strength counts too.',' Thirty to sixty minutes a week of muscle strengthening went with a 10 to 20 percent lower risk of death, heart disease and cancer.','Tohoku University, 2022. 16 studies. Evidence developing.']],
c2:[['s',1,'Fifteen minutes a day counts.','A walk counts. You do not need a gym. In a study of more than 400,000 people, about 15 minutes of activity a day went with a 14 percent lower risk of death and about 3 more years of life.','National Health Research Institutes, Taiwan, 2011. 416,175 people.'],
['how','How to do it','',['Step out your door, or walk the aisles of a store when the weather is bad.','Walk at a pace where you can still talk comfortably. If you cannot get a sentence out, ease up.','Walk seven or eight minutes away from home, then turn around. That is your fifteen.','If fifteen is too much today, start with five and add a minute or two each week.'],'<b>For strength, two days a week:</b> stand up from a chair several times in a row, do push-ups against a wall, or carry something heavy across the yard.','The talk test: University of Ottawa Heart Institute, 2014. Starting amounts and strength examples are under clinical review.',1],
['how','You do not need 10,000 steps','',[],'The benefit kept growing up to about 6,000 to 8,000 steps a day for people 60 and older, and 8,000 to 10,000 for people under 60. Any step up from where you are now helps.','University of Massachusetts Amherst, 2022. 47,471 adults. Evidence developing.',0],
['h','After I pour my morning coffee, I walk for fifteen minutes.'],

c1s:'Ongoing stress is an upstream cause. These are the effects found downstream, and what calming practice changed.',
c1:[['Distress goes with earlier death, even at low levels.',' People with mild distress had a 20 percent higher risk of death than people with none. The risk rose step by step with the level of distress.','BMJ, 2012. 68,222 adults in England followed about 8 years.'],
['Ongoing stress shows up in the body.'," Cortisol is the body's main stress hormone. In people living under ongoing stress, long term cortisol ran 43 percent higher. Once the stress had passed, it was no longer raised.",'TU Dresden, 2017. 66 studies, 10,289 people. Evidence developing.'],
['Calming practice lowers it.',' In controlled trials, meditation lowered cortisol, blood pressure and heart rate, most clearly in people who were ill or under heavy strain.','Peter MacCallum Cancer Centre, 2017: 45 trials. ELTE University, Budapest, 2021. Evidence developing.'],
['Less stress, anxiety and low mood.',' An eight week program showed large effects on stress in people without a diagnosis, and the gains held about 19 weeks later.','Harvard and McGill, 2015. 29 studies, 2,668 people.']],
c2:[['s',1,'Five minutes of slow breathing a day counts.','Free, anywhere, no equipment. In a one month trial done at home, five minutes of breathing practice a day improved mood more than five minutes of meditation did.','Stanford University, 2023. University of Sussex, 2023: 12 trials, 785 adults. Evidence developing.'],
['how','How to do box breathing','Picture a box with four equal sides. Each side is a count of four.',['Sit or stand comfortably. Let your shoulders drop.','Breathe in while you count to four.','Hold your breath while you count to four.','Breathe out slowly while you count to four.','Hold again while you count to four.','Repeat for about five minutes.'],'If four feels like too much, count to three. If you feel lightheaded, stop and breathe normally.<br><br><b>Another way: the long exhale.</b> Breathe in, then let the breath out slowly so the exhale is longer than the inhale.','Both were tested in the Stanford trial. The long exhale showed the strongest result.',1],
['how','What mindfulness is and how to do it','Mindfulness is paying attention to what is happening right now, on purpose, without judging it. That is all it is.',['Sit somewhere you will not be interrupted for five minutes.','Notice your breath going in and going out. You do not need to change it.',"Your mind will wander. Everyone's does.",'When you notice it has wandered, bring your attention back to your breath.','Do that again each time it wanders.'],'Noticing that your mind wandered and coming back is the practice. It is not a mistake. There is no way to do this wrong.','Wording under clinical review.',0],
['h','When I park the truck after work, I take five minutes of slow breathing before I go inside.'],
['b','If it does not feel calming','Most people find this calming. Some people feel more anxious or low when they sit quietly with their thoughts. If that happens, stop. It does not mean you failed. Movement, time outside or talking with someone may suit you better.','Coventry University, 2020. 83 studies, 6,703 people. About 8 percent reported an unwanted effect.'],
['s',2,'A stronger step you can still do yourself.','Work through a full eight week mindfulness program instead of single sessions. That is where the strongest evidence is. Free online versions work, and a version with a guide works better.','Harvard and McGill, 2015. University of Twente, 2016: 15 trials.'],
['s',3,'A teacher or counselor is a tool you can choose.','A trained teacher or a group gives you the guided version. If practice stirs up things that are hard to carry alone, a counselor is someone to talk it through with.','Wording under clinical review.']],
